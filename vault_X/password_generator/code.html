<script data-purpose="password-logic">
    // State
    const MIN_LENGTH = 6;
    const MAX_LENGTH = 32;
    let currentLength = 16;

    // DOM Elements
    const passwordDisplay = document.getElementById('passwordText');
    const lengthBadge = document.getElementById('lengthBadge');
    const toggleUpper = document.getElementById('toggleUpper');
    const toggleLower = document.getElementById('toggleLower');
    const toggleNumbers = document.getElementById('toggleNumbers');
    const toggleSymbols = document.getElementById('toggleSymbols');
    const inlineRefreshBtn = document.getElementById('inlineRefreshBtn');
    const refreshIconSvg = document.getElementById('refreshIconSvg');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const copyIconSvg = document.getElementById('copyIconSvg');
    const copyToast = document.getElementById('copyToast');
    const strengthLabel = document.getElementById('strengthLabel');

    // Ruler Elements
    const rulerTrack = document.getElementById('rulerTrack');
    const rulerThumb = document.getElementById('rulerThumb');

    // Character Sets
    const CHARS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    // Update ruler position based on length:
    // UPWARD = Higher length (top of track = MAX_LENGTH 32)
    // DOWNWARD = Lower length (bottom of track = MIN_LENGTH 6)
    function updateRulerUI() {
      const trackHeight = rulerTrack.clientHeight || 240;
      const thumbHeight = 11;
      const topPadding = 16;
      const bottomPadding = 16;
      const usableHeight = trackHeight - topPadding - bottomPadding - thumbHeight;

      // fraction: 1.0 at MAX_LENGTH, 0.0 at MIN_LENGTH
      const fraction = (currentLength - MIN_LENGTH) / (MAX_LENGTH - MIN_LENGTH);
      // top position: topPadding when fraction=1 (top), topPadding + usableHeight when fraction=0 (bottom)
      const topPos = topPadding + (1 - fraction) * usableHeight;

      rulerThumb.style.top = `${topPos}px`;
      lengthBadge.textContent = currentLength;
    }

    // Set length directly and trigger regeneration
    function setLength(newLen) {
      const clamped = Math.max(MIN_LENGTH, Math.min(MAX_LENGTH, Math.round(newLen)));
      if (clamped !== currentLength) {
        currentLength = clamped;
        updateRulerUI();
        generatePassword();
      }
    }

    // Calculate length from Y coordinate relative to rulerTrack
    function updateFromClientY(clientY) {
      const rect = rulerTrack.getBoundingClientRect();
      const topPadding = 16;
      const bottomPadding = 16;
      const usableHeight = rect.height - topPadding - bottomPadding;

      // yPos clamped within usable region
      const yPos = Math.max(topPadding, Math.min(rect.height - bottomPadding, clientY - rect.top));
      // fraction from bottom to top: 1.0 at top, 0.0 at bottom
      const fraction = 1 - ((yPos - topPadding) / usableHeight);
      const computedLen = MIN_LENGTH + fraction * (MAX_LENGTH - MIN_LENGTH);
      setLength(computedLen);
    }

    // Drag / Touch handling
    let isDragging = false;

    rulerTrack.addEventListener('pointerdown', (e) => {
      isDragging = true;
      rulerTrack.setPointerCapture(e.pointerId);
      updateFromClientY(e.clientY);
    });

    rulerTrack.addEventListener('pointermove', (e) => {
      if (isDragging) {
        updateFromClientY(e.clientY);
      }
    });

    const stopDragging = (e) => {
      if (isDragging) {
        isDragging = false;
        try {
          rulerTrack.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    };

    rulerTrack.addEventListener('pointerup', stopDragging);
    rulerTrack.addEventListener('pointercancel', stopDragging);

    // Mouse wheel support:
    // Scrolling UP (negative deltaY) increases length.
    // Scrolling DOWN (positive deltaY) decreases length.
    rulerTrack.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) {
        setLength(currentLength + 1); // scroll up = increase
      } else if (e.deltaY > 0) {
        setLength(currentLength - 1); // scroll down = decrease
      }
    }, { passive: false });

    // Generate random secure password
    function generatePassword() {
      let allowedChars = '';

      if (toggleUpper.checked) allowedChars += CHARS.upper;
      if (toggleLower.checked) allowedChars += CHARS.lower;
      if (toggleNumbers.checked) allowedChars += CHARS.numbers;
      if (toggleSymbols.checked) allowedChars += CHARS.symbols;

      // Fallback if none checked
      if (!allowedChars) {
        toggleLower.checked = true;
        allowedChars = CHARS.lower;
      }

      let result = '';
      const array = new Uint32Array(currentLength);
      window.crypto.getRandomValues(array);

      for (let i = 0; i < currentLength; i++) {
        result += allowedChars[array[i] % allowedChars.length];
      }

      passwordDisplay.textContent = result;
      updateStrength(result);
    }

    // Evaluate Strength
    function updateStrength(pwd) {
      let score = 0;
      if (pwd.length >= 8) score++;
      if (pwd.length >= 14) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) score++;

      if (score <= 1) {
        strengthLabel.textContent = 'Weak';
        strengthLabel.className = 'text-base font-semibold text-rose-500 transition-colors duration-200';
      } else if (score === 2) {
        strengthLabel.textContent = 'Fair';
        strengthLabel.className = 'text-base font-semibold text-amber-500 transition-colors duration-200';
      } else {
        strengthLabel.textContent = 'Strong';
        strengthLabel.className = 'text-base font-semibold text-emerald-500 transition-colors duration-200';
      }
    }

    // Toast triggers
    let toastTimeout;
    function showToast() {
      clearTimeout(toastTimeout);
      copyToast.classList.remove('-translate-y-16', 'opacity-0');
      copyToast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        copyToast.classList.remove('translate-y-0', 'opacity-100');
        copyToast.classList.add('-translate-y-16', 'opacity-0');
      }, 2000);
    }

    // Copy to clipboard with UI feedback
    async function copyPassword() {
      const text = passwordDisplay.textContent.trim();
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      showToast();

      if (copyBtnText) {
        const originalText = copyBtnText.textContent;
        copyBtnText.textContent = 'Copied!';
        copyIconSvg.innerHTML = '<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>';
        copyBtn.classList.add('bg-emerald-600');
        copyBtn.classList.remove('bg-[#0080ff]');

        setTimeout(() => {
          copyBtnText.textContent = originalText;
          copyIconSvg.innerHTML = '<path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>';
          copyBtn.classList.remove('bg-emerald-600');
          copyBtn.classList.add('bg-[#0080ff]');
        }, 1500);
      }
    }

    // Rotation effect on regenerate
    let currentRotation = 0;
    function triggerSpinAnimation() {
      currentRotation += 360;
      refreshIconSvg.style.transform = `rotate(${currentRotation}deg)`;
    }

    // Event Listeners for Toggles & Buttons
    [toggleUpper, toggleLower, toggleNumbers, toggleSymbols].forEach(toggle => {
      toggle.addEventListener('change', generatePassword);
    });

    inlineRefreshBtn.addEventListener('click', () => {
      generatePassword();
      triggerSpinAnimation();
    });

    copyBtn.addEventListener('click', copyPassword);

    // Initial Setup
    window.addEventListener('load', () => {
      updateRulerUI();
      passwordDisplay.textContent = ';lUA.P>/;hf6tRR)';
      updateStrength(';lUA.P>/;hf6tRR)');
    });
  </script>
<!-- END: Interactive Logic Scripts -->
