<script>
(function() {
  const defaultCategories = [
    { name: 'General', glyph: 'vpn_key' },
    { name: 'Email', glyph: 'mail' },
    { name: 'Instagram', glyph: 'photo_camera' },
    { name: 'Google', glyph: 'mail', isChar: true, char: 'G' },
    { name: 'Bank', glyph: 'account_balance' },
    { name: 'GitHub', glyph: 'code' },
    { name: 'Entertainment', glyph: 'movie' }
  ];

  const chipList = document.getElementById('category-chip-list');
  const activeGlyph = document.getElementById('active-icon-glyph');
  const activeBadge = document.getElementById('active-icon-badge');
  const bottomCategoryBadge = document.getElementById('category-badge-label');
  const btnOpenAdd = document.getElementById('btn-open-add-category');
  const addCategoryBox = document.getElementById('add-category-box');
  const btnCancelAdd = document.getElementById('btn-cancel-add-category');
  const btnConfirmAdd = document.getElementById('btn-confirm-add-category');
  const inputNewCat = document.getElementById('input-new-category-name');

  function getStoredCategories() {
    try {
      const stored = localStorage.getItem('VAULTX_categories') || localStorage.getItem('vault_categories');
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  }

  function saveCategoriesToStorage(categories) {
    try {
      localStorage.setItem('VAULTX_categories', JSON.stringify(categories));
      localStorage.setItem('vault_categories', JSON.stringify(categories));
      window.dispatchEvent(new CustomEvent('vault_categories_updated', { detail: categories }));
    } catch (e) {
      console.error(e);
    }
  }

  let selectedCategory = 'General';

  function renderChips() {
    const customCats = getStoredCategories();
    const allCats = [...defaultCategories, ...customCats];

    chipList.innerHTML = '';

    allCats.forEach(cat => {
      const isSelected = (cat.name === selectedCategory);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `category-chip shrink-0 px-4 py-2 rounded-full text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 ${
        isSelected
          ? 'bg-vaultAccent text-white border border-vaultAccent shadow-md'
          : 'bg-vaultSurface border border-vaultBorder/50 text-vaultMuted hover:text-white'
      }`;
      btn.setAttribute('data-category', cat.name);
      btn.setAttribute('data-glyph', cat.glyph || 'folder');

      if (cat.isChar) {
        btn.innerHTML = `<span class="font-black text-[14px] leading-none">${cat.char}</span><span>${cat.name}</span>`;
      } else {
        btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">${cat.glyph || 'folder'}</span><span>${cat.name}</span>`;
      }

      btn.addEventListener('click', () => {
        selectedCategory = cat.name;
        setActiveChip(btn, cat.name, cat.glyph || 'folder');
      });

      chipList.appendChild(btn);
    });

    // Append Add button at end
    if (btnOpenAdd) {
      chipList.appendChild(btnOpenAdd);
    }
  }

  function setActiveChip(selectedChip, catName, glyph) {
    const chips = chipList.querySelectorAll('.category-chip');
    chips.forEach(chip => {
      chip.classList.remove('bg-vaultAccent', 'text-white', 'border-vaultAccent', 'shadow-md');
      chip.classList.add('bg-vaultSurface', 'border-vaultBorder/50', 'text-vaultMuted');
    });
    selectedChip.classList.remove('bg-vaultSurface', 'border-vaultBorder/50', 'text-vaultMuted');
    selectedChip.classList.add('bg-vaultAccent', 'text-white', 'border-vaultAccent', 'shadow-md');

    if (bottomCategoryBadge) {
      bottomCategoryBadge.textContent = catName;
    }
    if (activeGlyph) {
      activeGlyph.textContent = glyph;
    }
    if (activeBadge) {
      activeBadge.classList.add('scale-110');
      setTimeout(() => activeBadge.classList.remove('scale-110'), 200);
    }
  }

  if (btnOpenAdd) {
    btnOpenAdd.addEventListener('click', () => {
      addCategoryBox.classList.remove('hidden');
      inputNewCat.value = '';
      inputNewCat.focus();
    });
  }

  if (btnCancelAdd) {
    btnCancelAdd.addEventListener('click', () => {
      addCategoryBox.classList.add('hidden');
    });
  }

  function handleCreateCategory() {
    const newName = (inputNewCat.value || '').trim();
    if (!newName) return;

    const existingCustom = getStoredCategories();
    const exists = [...defaultCategories, ...existingCustom].some(
      c => c.name.toLowerCase() === newName.toLowerCase()
    );

    if (!exists) {
      existingCustom.push({ name: newName, glyph: 'folder' });
      saveCategoriesToStorage(existingCustom);
    }

    selectedCategory = newName;
    addCategoryBox.classList.add('hidden');
    renderChips();

    if (bottomCategoryBadge) {
      bottomCategoryBadge.textContent = newName;
    }
    if (activeGlyph) {
      activeGlyph.textContent = 'folder';
    }
  }

  if (btnConfirmAdd) {
    btnConfirmAdd.addEventListener('click', handleCreateCategory);
  }
  if (inputNewCat) {
    inputNewCat.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCreateCategory();
      }
    });
  }

  renderChips();
})();
</script></section>

<script>document.addEventListener('DOMContentLoaded', () => { const btnSave = document.getElementById('btn-save'); const inputName = document.getElementById('input-name'); const inputUsername = document.getElementById('input-username'); const inputEmail = document.getElementById('input-email'); const inputPassword = document.getElementById('input-password'); const inputUrl = document.getElementById('input-url'); const inputNotes = document.getElementById('input-notes'); const categoryBadgeLabel = document.getElementById('category-badge-label'); const activeGlyph = document.getElementById('active-icon-glyph'); const toast = document.getElementById('toast-banner'); const toastMsg = document.getElementById('toast-message'); function displayToast(msg, isSuccess = true) { if (toastMsg) toastMsg.textContent = msg; if (toast) { toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3'); toast.classList.add('opacity-100', 'translate-y-0'); setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3'); }, 2200); } } function saveCredential() { const name = (inputName?.value || '').trim(); const username = (inputUsername?.value || '').trim(); const email = (inputEmail?.value || '').trim(); const password = (inputPassword?.value || '').trim(); const url = (inputUrl?.value || '').trim(); const notes = (inputNotes?.value || '').trim(); const category = categoryBadgeLabel?.textContent?.trim() || 'General'; const icon = activeGlyph?.textContent?.trim() || 'vpn_key'; if (!name) { displayToast('Please enter a name or service', false); if (inputName) inputName.focus(); return; } if (!password && !email) { displayToast('Please provide a password or email', false); if (inputPassword) inputPassword.focus(); return; } const newEntry = { id: 'pwd_' + Date.now(), name, username, email, password, url, notes, category, icon, createdAt: new Date().toISOString() }; try { const existing = JSON.parse(localStorage.getItem('VAULTX_vault_passwords') || localStorage.getItem('vault_passwords') || '[]'); const updated = [newEntry, ...existing]; localStorage.setItem('VAULTX_vault_passwords', JSON.stringify(updated)); localStorage.setItem('vault_passwords', JSON.stringify(updated)); window.dispatchEvent(new CustomEvent('vault_data_updated', { detail: updated })); window.dispatchEvent(new Event('storage')); } catch (e) { console.error('LocalStorage error:', e); } displayToast('Saved to Vault!'); const form = document.getElementById('vault-form'); if (form) form.reset(); if (categoryBadgeLabel) categoryBadgeLabel.textContent = 'General'; if (activeGlyph) activeGlyph.textContent = 'vpn_key'; } if (btnSave) { btnSave.addEventListener('click', (e) => { e.stopImmediatePropagation(); saveCredential(); }, true); } });</script></form>

      const eyeIcon = document.getElementById('eye-icon');
      const toast = document.getElementById('toast-banner');
      const toastMessage = document.getElementById('toast-message');

      const swipeThumb = document.getElementById('swipe-thumb');
      const swipeProgress = document.getElementById('swipe-progress');
      const swipeLabel = document.getElementById('swipe-label');

      // Helper: Toast display
      function showToast(msg) {
        toastMessage.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
        }, 2200);
      }

      // Password Generation Logic
      function generatePassword(length = 20) {
        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()-_=+[]{}|;:,.<>?';
        const all = uppercase + lowercase + numbers + symbols;

        let password = '';
        // Guarantee at least one of each category
        password += uppercase[Math.floor(Math.random() * uppercase.length)];
        password += lowercase[Math.floor(Math.random() * lowercase.length)];
        password += numbers[Math.floor(Math.random() * numbers.length)];
        password += symbols[Math.floor(Math.random() * symbols.length)];

        for (let i = password.length; i < length; i++) {
          password += all[Math.floor(Math.random() * all.length)];
        }

        // Shuffle
        return password.split('').sort(() => 0.5 - Math.random()).join('');
      }

      // Swipe Slider Interaction Logic
      let isDragging = false;
      let startX = 0;
      let currentX = 0;
      let maxSlide = 0;
      let isCompleted = false;

      function updateDimensions() {
        const trackWidth = swipeTrack.clientWidth;
        const thumbWidth = swipeThumb.offsetWidth;
        maxSlide = Math.max(0, trackWidth - thumbWidth - 8);
      }

      function setSliderPosition(pos, animated = false) {
        if (animated) {
          swipeThumb.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
          swipeProgress.style.transition = 'width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        } else {
          swipeThumb.style.transition = 'none';
          swipeProgress.style.transition = 'none';
        }
        swipeThumb.style.transform = `translateX(${pos}px)`;
        swipeProgress.style.width = `${pos + 44}px`;
      }

      function triggerPasswordGeneration() {
        if (isCompleted) return;
        isCompleted = true;

        // Generate and fill password
        const strongPass = generatePassword(18);
        inputPassword.value = strongPass;
        inputPassword.type = 'text';
        eyeIcon.textContent = 'visibility_off';

        // Success visual feedback on the slider
        swipeIcon.textContent = 'check';
        swipeThumb.classList.remove('bg-vaultAccent');
        swipeThumb.classList.add('bg-emerald-500');
        swipeLabel.textContent = 'Password Generated!';
        swipeLabel.classList.remove('shimmer-text');
        swipeLabel.classList.add('text-emerald-400');

        showToast('Generated strong 18-char password');

        // Smooth reset after brief celebration
        setTimeout(() => {
          setSliderPosition(0, true);
          setTimeout(() => {
            swipeIcon.textContent = 'auto_awesome';
            swipeThumb.classList.remove('bg-emerald-500');
            swipeThumb.classList.add('bg-vaultAccent');
            swipeLabel.textContent = 'Swipe to Create Password';
            swipeLabel.classList.remove('text-emerald-400');
            swipeLabel.classList.add('shimmer-text');
            isCompleted = false;
          }, 350);
        }, 850);
      }

      // Drag Handlers (Pointer / Touch / Mouse)
      function onPointerDown(e) {
        if (isCompleted) return;
        updateDimensions();
        isDragging = true;
        startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        currentX = 0;
        swipeThumb.style.transition = 'none';
        swipeProgress.style.transition = 'none';
      }

      function onPointerMove(e) {
        if (!isDragging || isCompleted) return;
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const delta = clientX - startX;
        currentX = Math.max(0, Math.min(delta, maxSlide));
        setSliderPosition(currentX, false);

        // Opacity of instruction text dims as slider nears end
        const progress = currentX / (maxSlide || 1);
        swipeLabel.style.opacity = `${Math.max(0.15, 1 - progress * 1.2)}`;

        // Snap threshold
        if (currentX >= maxSlide * 0.9) {
          isDragging = false;
          setSliderPosition(maxSlide, true);
          triggerPasswordGeneration();
        }
      }

      function onPointerUp() {
        if (!isDragging || isCompleted) return;
        isDragging = false;
        swipeLabel.style.opacity = '1';

        // Animate back if released before completion
        if (currentX < maxSlide * 0.9) {
          setSliderPosition(0, true);
        }
      }

      // Slider Event Listeners
      swipeThumb.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      swipeThumb.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      // Accessibility / Click Support
      swipeThumb.addEventListener('click', () => {
        if (!isCompleted && currentX === 0) {
          updateDimensions();
          setSliderPosition(maxSlide, true);
          setTimeout(() => {
            triggerPasswordGeneration();
          }, 150);
        }
      });

      swipeTrack.addEventListener('click', (e) => {
        if (e.target !== swipeThumb && !swipeThumb.contains(e.target) && !isCompleted) {
          updateDimensions();
          setSliderPosition(maxSlide, true);
          setTimeout(() => {
            triggerPasswordGeneration();
          }, 150);
        }
      });

      // Icon Selection Handler
      iconButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Reset all buttons style
          iconButtons.forEach(btn => {
            const circle = btn.querySelector('.icon-circle');
            const label = btn.querySelector('span:last-child');
            circle.classList.remove('border-vaultAccent', 'text-vaultAccent');
            circle.classList.add('border-transparent', 'text-vaultMutedLight');
            label.classList.remove('text-white');
            label.classList.add('text-vaultMuted');
          });

          // Highlight selected button
          const activeCircle = button.querySelector('.icon-circle');
          const activeText = button.querySelector('span:last-child');
          activeCircle.classList.remove('border-transparent', 'text-vaultMutedLight');
          activeCircle.classList.add('border-vaultAccent', 'text-vaultAccent');
          activeText.classList.remove('text-vaultMuted');
          activeText.classList.add('text-white');

          // Extract data attributes
          const serviceName = button.dataset.name;
          const serviceCategory = button.dataset.category || 'General';
          const glyph = button.dataset.glyph;
          const defaultUrl = button.dataset.url;

          // Update Fields
          if (serviceName) {
            inputName.value = serviceName;
          }
          if (defaultUrl && !inputUrl.value) {
            inputUrl.value = defaultUrl;
          }
          categoryBadgeLabel.textContent = serviceCategory;

          // Update Top Right Badge
          if (glyph) {
            activeGlyph.textContent = glyph;
          }

          // Subtle feedback animation on preview badge
          activeBadge.classList.add('scale-110');
          setTimeout(() => activeBadge.classList.remove('scale-110'), 200);
        });
      });

      // Toggle Password Visibility
      btnToggleEye.addEventListener('click', () => {
        if (inputPassword.type === 'password') {
          inputPassword.type = 'text';
          eyeIcon.textContent = 'visibility_off';
        } else {
          inputPassword.type = 'password';
          eyeIcon.textContent = 'visibility';
        }
      });

      // Action Handlers
      btnSave.addEventListener('click', () => {
        if (!inputName.value.trim() && !inputPassword.value.trim()) {
          showToast('Please provide a name and password');
          return;
        }
        showToast('Password entry saved successfully!');
      });

      btnCancel.addEventListener('click', () => {
        if (confirm('Discard changes?')) {
          document.getElementById('vault-form').reset();
          categoryBadgeLabel.textContent = 'General';
          activeGlyph.textContent = 'vpn_key';
        }
      });
    });
  </script>
<!-- END: Interactive Behavior Script -->
