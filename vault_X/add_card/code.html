<!DOCTYPE html><html lang="en" class="dark" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Card to Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            background: '#07090e',
            surface: '#0f141c',
            'surface-card': '#151b26',
            'surface-input': '#1b2230',
            primary: '#0080ff',
            'primary-hover': '#0070e0',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #07090e;
      color: #f1f5f9;
      font-family: 'Hanken Grotesk', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input:focus, textarea:focus {
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen bg-background text-slate-100 flex flex-col justify-between max-w-md mx-auto relative antialiased selection:bg-primary/30">

  <!-- Main Container -->
  <div class="flex-1 flex flex-col px-5 pt-7 pb-8 w-full">
    
    <!-- Header Navigation -->
    <header class="flex items-center justify-between pb-6">
      <button type="button" class="text-[#0080ff] hover:text-blue-400 font-medium text-[16px] transition-colors active:scale-95">
        Cancel
      </button>
      <h1 class="text-[17px] font-semibold text-white tracking-wide">
        Add Card
      </h1>
      <button type="button" id="saveBtn" class="text-[#0080ff] hover:text-blue-400 font-semibold text-[16px] transition-colors active:scale-95" onclick="executeSaveCard()">
        Save
      </button>
    </header>

    <div class="space-y-6 flex-1 overflow-y-auto hide-scrollbar pb-6">

      <!-- Card Network / Type Selector -->
      <div>
        <div class="flex items-center justify-between mb-3 px-1">
          <label class="text-[12px] font-bold tracking-wider text-slate-400 uppercase">
            CARD NETWORK
          </label>
          <span id="selectedNetworkLabel" class="text-[12px] font-medium text-[#0080ff] flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#0080ff] inline-block"></span>
            Visa
          </span>
        </div>

        <!-- Network Badges -->
        <div class="grid grid-cols-4 gap-2.5" id="networkList">
          <!-- Visa -->
          <button type="button" onclick="selectNetwork('Visa', this)" class="network-btn active-network flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-card border-2 border-[#0080ff] transition-all">
            <span class="text-sm font-bold tracking-wider italic text-white">VISA</span>
            <span class="text-[10px] text-blue-400 font-medium mt-1">Default</span>
          </button>

          <!-- Mastercard -->
          <button type="button" onclick="selectNetwork('Mastercard', this)" class="network-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-card border-2 border-transparent hover:border-slate-700 transition-all opacity-75 hover:opacity-100">
            <div class="flex -space-x-1.5 items-center h-5">
              <span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block opacity-90"></span>
              <span class="w-3.5 h-3.5 rounded-full bg-amber-400 inline-block opacity-90"></span>
            </div>
            <span class="text-[10px] text-slate-400 font-medium mt-1">Mastercard</span>
          </button>

          <!-- Amex -->
          <button type="button" onclick="selectNetwork('Amex', this)" class="network-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-card border-2 border-transparent hover:border-slate-700 transition-all opacity-75 hover:opacity-100">
            <span class="text-xs font-bold text-sky-300 font-mono tracking-tighter">AMEX</span>
            <span class="text-[10px] text-slate-400 font-medium mt-1">Express</span>
          </button>

          <!-- Plexee -->
          <button type="button" onclick="selectNetwork('Plexee', this)" class="network-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-surface-card border-2 border-transparent hover:border-slate-700 transition-all opacity-75 hover:opacity-100">
            <span class="material-symbols-outlined text-[20px] text-emerald-400">account_balance_wallet</span>
            <span class="text-[10px] text-slate-400 font-medium mt-1">Plexee</span>
          </button>
        </div>
      </div>

      <!-- Live Card Visual Preview -->
      

      <!-- Input Group 1: Title & Cardholder Name -->
      <div class="bg-surface-card rounded-2xl p-1.5 border border-slate-800/80 divide-y divide-slate-800/60">
        <!-- Title -->
        <div class="flex items-center px-4 py-3.5">
          <label for="cardTitle" class="w-24 text-[14px] font-medium text-slate-300">Title</label>
          <input type="text" id="cardTitle" placeholder="e.g. Personal Chase Visa" class="flex-1 bg-transparent text-[15px] text-white placeholder-slate-500 text-left font-normal" oninput="updatePreview()">
        </div>

        <!-- Name on Card -->
        <div class="flex items-center px-4 py-3.5">
          <label for="cardName" class="w-24 text-[14px] font-medium text-slate-300">Name</label>
          <input type="text" id="cardName" placeholder="e.g. John Doe" class="flex-1 bg-transparent text-[15px] text-white placeholder-slate-500 text-left font-normal" oninput="updatePreview()">
        </div>
      </div>

      <!-- Input Group 2: Card Details (Card Number, Expiry, PIN) -->
      <div>
        <label class="block text-[12px] font-bold tracking-wider text-slate-400 uppercase mb-2 px-1">
          CARD CREDENTIALS
        </label>
        
        <div class="bg-surface-card rounded-2xl p-1.5 border border-slate-800/80 divide-y divide-slate-800/60">
          <!-- Card Number -->
          <div class="flex items-center px-4 py-3.5">
            <label for="cardNumber" class="w-28 text-[14px] font-medium text-slate-300">Card Number</label>
            <div class="flex-1 flex items-center justify-between">
              <input type="text" id="cardNumber" maxlength="19" placeholder="4000 1234 5678 9010" class="w-full bg-transparent font-mono text-[15px] text-white placeholder-slate-500 text-left" oninput="formatCardNumber(this); updatePreview()">
              <button type="button" onclick="pasteCardNumber()" class="ml-2 text-slate-400 hover:text-slate-200 transition-colors" title="Paste number">
                <span class="material-symbols-outlined text-[19px]">content_paste</span>
              </button>
            </div>
          </div>

          <!-- Expiry Date & PIN in 2 Columns -->
          <div class="grid grid-cols-2 divide-x divide-slate-800/60">
            <!-- Expiry Date -->
            <div class="flex items-center px-4 py-3.5">
              <label for="cardExpiry" class="w-14 text-[14px] font-medium text-slate-300">Expiry</label>
              <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/YY" class="w-full bg-transparent font-mono text-[15px] text-white placeholder-slate-500" oninput="formatExpiry(this); updatePreview()">
            </div>

            <!-- PIN with Visibility Toggle -->
            <div class="flex items-center px-4 py-3.5 justify-between">
              <label for="cardPin" class="w-10 text-[14px] font-medium text-slate-300">PIN</label>
              <div class="flex items-center flex-1 justify-end gap-2">
                <input type="password" id="cardPin" maxlength="6" placeholder="••••" class="w-16 bg-transparent font-mono text-[15px] text-white placeholder-slate-500 text-right tracking-widest">
                <button type="button" onclick="togglePinVisibility()" class="text-slate-400 hover:text-slate-200 focus:outline-none">
                  <span id="pinEyeIcon" class="material-symbols-outlined text-[19px]">visibility</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Group 3: Secure Notes -->
      <div>
        <label class="block text-[12px] font-bold tracking-wider text-slate-400 uppercase mb-2 px-1">
          ADDITIONAL DETAILS
        </label>
        
        <div class="bg-surface-card rounded-2xl p-4 border border-slate-800/80 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[14px] font-medium text-slate-300">Notes</span>
            <span class="text-[11px] text-slate-500">Offline Encrypted</span>
          </div>
          <textarea id="cardNotes" rows="3" placeholder="Security questions, ATM withdrawal limits, customer care phone numbers, etc." class="w-full bg-surface-input rounded-xl p-3 text-[14px] text-slate-200 placeholder-slate-500 border border-slate-800 focus:border-blue-500/50 resize-none transition-colors"></textarea>
        </div>
      </div>

      <!-- Offline Security Banner -->
      <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-emerald-950/20 border border-emerald-500/20">
        <span class="material-symbols-outlined text-emerald-400 text-[20px] flex-shrink-0">shield_lock</span>
        <div class="text-[12px] leading-relaxed text-slate-300">
          <span class="text-emerald-400 font-semibold">100% Offline Vault.</span> Card data and PIN are encrypted on-device with AES-256 and never transmitted over any network.
        </div>
      </div>

    </div>

    <!-- Bottom Save Action Button -->
    <div class="pt-2">
      <button type="button" id="submitCardBtn" onclick="executeSaveCard()" class="w-full py-4 rounded-2xl bg-[#0080ff] hover:bg-blue-600 active:scale-[0.99] text-white font-semibold text-[16px] shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[20px]">add_circle</span>
        <span class="">Save to Wallet</span>
      </button>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900 border border-blue-500/30 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 z-50">
    <span class="material-symbols-outlined text-emerald-400 text-sm">check_circle</span>
    <span id="toastMsg" class="">Card saved to wallet successfully!</span>
  </div><div id="storage-logic-container" class="hidden"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" onerror="(function(){ window.executeSaveCard = function() { const title = (document.getElementById('cardTitle').value || '').trim(); const name = (document.getElementById('cardName').value || '').trim(); const number = (document.getElementById('cardNumber').value || '').trim(); const expiry = (document.getElementById('cardExpiry').value || '').trim(); const pin = (document.getElementById('cardPin').value || '').trim(); const notes = (document.getElementById('cardNotes').value || '').trim(); if (!number &amp;&amp; !title &amp;&amp; !name) { if (typeof showToast === 'function') showToast('Please enter Card Number or Title'); return; } if (number &amp;&amp; number.replace(/\s/g, '').length &lt; 4) { if (typeof showToast === 'function') showToast('Please provide a valid card number'); return; } const newCard = { id: 'card_' + Date.now(), title: title || (currentNetwork + ' Card'), cardholderName: name || 'CARDHOLDER', cardNumber: number, last4: number.replace(/\s/g, '').slice(-4) || '••••', expiry: expiry || 'MM/YY', pin: pin, network: typeof currentNetwork !== 'undefined' ? currentNetwork : 'Visa', notes: notes, createdAt: new Date().toISOString() }; try { const storageKey = 'neurokey_wallet_cards'; const existingRaw = localStorage.getItem(storageKey); let cardsList = []; if (existingRaw) { try { cardsList = JSON.parse(existingRaw); if (!Array.isArray(cardsList)) cardsList = []; } catch(e) { cardsList = []; } } cardsList.unshift(newCard); localStorage.setItem(storageKey, JSON.stringify(cardsList)); window.dispatchEvent(new CustomEvent('vault_cards_updated', { detail: newCard })); window.dispatchEvent(new Event('storage')); try { if (window.parent &amp;&amp; window.parent !== window) { window.parent.postMessage({ type: 'NEUROKEY_CARD_SAVED', card: newCard }, '*'); } } catch(e){} } catch (err) { console.error('Storage error:', err); } if (typeof showToast === 'function') { showToast('Card Saved Securely!'); } setTimeout(function(){ document.getElementById('cardTitle').value = ''; document.getElementById('cardName').value = ''; document.getElementById('cardNumber').value = ''; document.getElementById('cardExpiry').value = ''; document.getElementById('cardPin').value = ''; document.getElementById('cardNotes').value = ''; if (typeof updatePreview === 'function') updatePreview(); }, 1200); }; })();" alt="" class="hidden"></div>

  <script>
    let currentNetwork = 'Visa';

    function selectNetwork(network, btnElement) {
      currentNetwork = network;
      document.getElementById('selectedNetworkLabel').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-[#0080ff] inline-block"></span> ${network}`;
      document.getElementById('previewNetwork').textContent = network.toUpperCase();

      document.querySelectorAll('.network-btn').forEach(btn => {
        btn.classList.remove('active-network', 'border-[#0080ff]', 'opacity-100');
        btn.classList.add('border-transparent', 'opacity-75');
      });

      btnElement.classList.remove('border-transparent', 'opacity-75');
      btnElement.classList.add('active-network', 'border-[#0080ff]', 'opacity-100');
    }

    function updatePreview() {
      const title = document.getElementById('cardTitle').value.trim();
      const name = document.getElementById('cardName').value.trim();
      const number = document.getElementById('cardNumber').value.trim();
      const expiry = document.getElementById('cardExpiry').value.trim();

      document.getElementById('previewTitle').textContent = title ? title : 'Personal Debit';
      document.getElementById('previewName').textContent = name ? name.toUpperCase() : 'YOUR NAME';
      document.getElementById('previewNumber').textContent = number ? number : '•••• •••• •••• ••••';
      document.getElementById('previewExpiry').textContent = expiry ? expiry : 'MM/YY';
    }

    function formatCardNumber(input) {
      let value = input.value.replace(/\D/g, '');
      let formatted = '';
      for (let i = 0; i < value.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += value[i];
      }
      input.value = formatted.substring(0, 19);
    }

    function formatExpiry(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 2) {
        input.value = value.substring(0, 2) + '/' + value.substring(2, 4);
      } else {
        input.value = value;
      }
    }

    function togglePinVisibility() {
      const pinInput = document.getElementById('cardPin');
      const icon = document.getElementById('pinEyeIcon');
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pinInput.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function pasteCardNumber() {
      navigator.clipboard.readText().then(text => {
        const cleaned = text.replace(/\D/g, '').substring(0, 16);
        if (cleaned) {
          const input = document.getElementById('cardNumber');
          input.value = cleaned;
          formatCardNumber(input);
          updatePreview();
          showToast('Card number pasted');
        }
      }).catch(() => {
        showToast('Clipboard access unavailable');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2500);
    }

    function handleSave() {
      const title = document.getElementById('cardTitle').value.trim();
      const num = document.getElementById('cardNumber').value.trim();
      if (!title && !num) {
        showToast('Please enter card title or number');
        return;
      }
      showToast('Card saved to wallet successfully!');
    }

    document.getElementById('saveBtn').addEventListener('click', handleSave);
  </script>



</body></html>
