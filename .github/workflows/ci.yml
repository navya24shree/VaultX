name: NeuroKey CI Matrix

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Lint, Tests & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Secret Leak & Plaintext Logging Scan
        run: |
          chmod +x scripts/check_secrets_log.sh
          ./scripts/check_secrets_log.sh lib

      - name: Run Flutter Analyzer (Strict Lints)
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test --coverage

  build-android:
    name: Build Android (APK)
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

  build-windows:
    name: Build Windows Desktop
    needs: code-quality-and-security
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --debug

  build-apple:
    name: Build Apple Platforms (iOS & macOS)
    needs: code-quality-and-security
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ios, macos]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        if: matrix.target == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --no-codesign --debug

      - name: Build macOS Application
        if: matrix.target == 'macos'
        run: flutter build macos --debug
